<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SNIPE - Сканер сети</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">SNIPE: Сканер сети</h1>

    <form method="post" action="/scan/" class="row g-3 mb-4">
        {% csrf_token %}
        <div class="col-auto">
            <input type="text" name="ip_range" placeholder="192.168.1.0/24" class="form-control" required>
        </div>
        <div class="col-auto">
            <select name="protocol" class="form-select">
                <option value="tcp">TCP</option>
                <option value="udp">UDP</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Сканировать</button>
        </div>
    </form>

    <form method="get" action="/" class="row g-3 mb-4">
        <div class="col-auto">
            <input type="text" name="ip_filter" placeholder="Фильтр по IP" class="form-control" value="{{ request.GET.ip_filter }}">
        </div>
        <div class="col-auto">
            <input type="text" name="os_filter" placeholder="Фильтр по ОС" class="form-control" value="{{ request.GET.os_filter }}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-secondary">Фильтровать</button>
        </div>
    </form>

    <a href="/export/" class="btn btn-success mb-3">Экспорт в JSON</a>

    <form method="post" action="{% url 'clear_history' %}" onsubmit="return confirm('Вы уверены, что хотите очистить историю сканирования?');">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Очистить историю</button>
    </form>


    <h2>Результаты сканирования:</h2>
    {% for r in results %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ r.ip }} <small class="text-muted">{{ r.scan_date }}</small></h5>
                <p class="card-text">MAC: {{ r.mac }} | ОС: {{ r.os }}</p>
                <p class="card-text">Порты: {{ r.open_ports|join:", " }}</p>
                <p class="card-text">Баннеры: <code>{{ r.banners }}</code></p>
            </div>
        </div>
    {% empty %}
        <p>Нет данных.</p>
    {% endfor %}
</body>
</html>
